<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlay Portal | Gamified Learning Dashboard</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-space: #2D1B60;
            --surface-card: #4E31AA;
            --accent-yellow: #FFD23F;
            --accent-pink: #FF3366;
            --accent-cyan: #00F5D4;
            --success-green: #00E676;
            --text-white: #FFFFFF;
            --text-muted: #D1C4E9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-space); color: var(--text-white); padding-bottom: 30px; overflow-x: hidden; }

        .view-panel { display: none; padding: 16px; }
        .view-panel.active { display: block; }

        /* Login Screen Form Styles */
        .login-container {
            max-width: 360px; margin: 60px auto; background-color: var(--surface-card);
            border-radius: 20px; padding: 30px 20px; border: 3px solid var(--accent-cyan);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center;
        }

        .login-container h2 { color: var(--accent-yellow); font-size: 1.8rem; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--text-muted); }
        
        .form-input {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1);
            background-color: rgba(0,0,0,0.2); color: #fff; font-size: 1rem; outline: none;
        }
        .form-input:focus { border-color: var(--accent-yellow); }

        .btn-action {
            width: 100%; background-color: var(--accent-pink); color: #fff; border: none;
            padding: 12px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 0 #C2185B; transition: transform 0.1s; margin-top: 10px;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 0 #C2185B; }
        .btn-secondary { background-color: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); margin-top: 10px; box-shadow: none; }

        /* Header Navigation Bars */
        header {
            background-color: rgba(78, 49, 170, 0.85); padding: 16px; text-align: center;
            border-bottom: 4px solid var(--accent-cyan); display: flex; justify-content: space-between; align-items: center;
        }
        .header-title { color: var(--accent-yellow); font-size: 1.3rem; text-shadow: 1px 1px #000; }
        .logout-btn { background: none; border: 2px solid var(--accent-pink); color: var(--accent-pink); padding: 4px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; }

        /* Stats & Level Tracker Tracks */
        .stats-bar { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem; }
        .stats-bar span b { color: var(--accent-cyan); }

        .grade-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .grade-btn { background: var(--surface-card); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .grade-btn.active { background: var(--accent-pink); border-color: var(--accent-yellow); }

        .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .subject-card { background-color: var(--surface-card); border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .subject-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 1.3rem; color: #000; }
        
        .level-row { background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; margin-top: 6px; display: flex; justify-content: space-between; font-size: 0.8rem; cursor: pointer; }
        .level-row.locked { opacity: 0.4; cursor: not-allowed; }

        /* Admin Management Dashboard Interface */
        .admin-box { background: var(--surface-card); padding: 16px; border-radius: 16px; border: 2px solid var(--accent-yellow); margin-bottom: 16px; }
        .student-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
        .student-table th, .student-table td { padding: 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .student-table th { color: var(--accent-cyan); }

        /* Quiz Popups Framework */
        .quiz-modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(17,11,38,0.95); z-index: 3000; display:none; align-items:center; justify-content:center; padding: 16px; }
        .quiz-modal.active { display: flex; }
        .quiz-box { background: var(--surface-card); border: 3px solid var(--accent-yellow); border-radius: 20px; width:100%; max-width:400px; padding: 20px; position:relative; text-align:center; }
        .quiz-q { font-size: 1.2rem; margin: 14px 0; }
        .options-stack { display: flex; flex-direction: column; gap: 8px; }
        .opt-btn { background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); color:#fff; padding: 12px; border-radius: 10px; font-size: 0.95rem; text-align:left; cursor:pointer; }
    </style>
</head>
<body>

    <!-- SECTION 1: GLOBAL GATEWAY LOGIN PORTAL -->
    <div id="panel-login" class="view-panel active">
        <div class="login-container">
            <h2>EduPlay Portal</h2>
            <div class="form-group">
                <label>Username / Student ID</label>
                <input type="text" id="login-user" class="form-input" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-pass" class="form-input" placeholder="••••••••">
            </div>
            <button class="btn-action" onclick="handleLogin()">Launch App 🚀</button>
        </div>
    </div>

    <!-- SECTION 2: STUDENT QUIZ GAMEPLAY HUBS -->
    <div id="panel-student" class="view-panel">
        <header>
            <div class="header-title" id="student-welcome">Hi, Student!</div>
            <button class="logout-btn" onclick="triggerLogout()">Logout</button>
        </header>
        <div style="padding:16px;">
            <div class="stats-bar">
                <span>Logins: <b id="stat-logins">0</b></span>
                <span>My Total Score: <b id="stat-score">0 XP</b></span>
            </div>
         <div class="grade-filter-bar">
    <button class="grade-btn" onclick="toggleGrade(this, 'stage-A-kindergarten')">Kindergarten</button>
    <button class="grade-btn" onclick="toggleGrade(this, 'stage-B-grades1-5')">Grades 1-5</button>
    <button class="grade-btn" onclick="toggleGrade(this, 'stage-C-grades6-10')">Grades 6-10</button>
    <!-- Make sure the text inside the quotation marks matches your folder name! -->
    <button class="grade-btn active" onclick="toggleGrade(this, 'stage-D-over10')">Over 10 Grades</button>
</div>


            <main class="subject-grid">
                <div class="subject-card"><div class="subject-icon" style="background:#FFD23F;"><i class="fa-solid fa-calculator"></i></div><h4>Math</h4><div class="level-tracker-container" id="track-math"></div></div>
                <div class="subject-card"><div class="subject-icon" style="background:#FF3366;"><i class="fa-solid fa-brain"></i></div><h4>IQ</h4><div class="level-tracker-container" id="track-iq"></div></div>
                <div class="subject-card"><div class="subject-icon" style="background:#00F5D4;"><i class="fa-solid fa-font"></i></div><h4>English</h4><div class="level-tracker-container" id="track-english"></div></div>
                <div class="subject-card"><div class="subject-icon" style="background:#9C27B0;color:#fff;"><i class="fa-solid fa-book"></i></div><h4>Arabic</h4><div class="level-tracker-container" id="track-arabic"></div></div>
            </main>
        </div>
    </div>

    <!-- SECTION 3: TEACHER / ADMIN CONTROL DASHBOARD -->
    <div id="panel-admin" class="view-panel">
        <header>
            <div class="header-title">Teacher Admin Control Panel</div>
            <button class="logout-btn" onclick="triggerLogout()">Logout</button>
        </header>
        <div style="padding:16px;">
            <div class="admin-box">
                <h4>➕ Add New Student Account</h4>
                <div class="form-group" style="margin-top:10px;">
                    <input type="text" id="new-student-name" class="form-input" placeholder="Student Username" style="margin-bottom:8px;">
                    <input type="password" id="new-student-pass" class="form-input" placeholder="Assign Login Password">
                </div>
                <button class="btn-action" onclick="addNewStudent()">Save Student Account Securely</button>
            </div>
            <div class="admin-box" style="overflow-x:auto;">
                <h4>📋 Registered Student Trackers</h4>
                <table class="student-table">
                    <thead><tr><th>Student</th><th>Password</th><th>Login Count</th><th>Score Balance</th></tr></thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SECTION 4: INTERACTIVE MULTI-QUESTION QUIZ ENGINE POPUP -->
    <div class="quiz-modal" id="quiz-frame">
        <div class="quiz-box">
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--accent-cyan);">
                <span id="quiz-title-tag">MATH - LEVEL 1</span>
                <span id="quiz-progress-tag">Q: 1/3</span>
            </div>
            <div class="quiz-q" id="quiz-question-text">What is 2 + 3?</div>
            <div class="options-stack" id="quiz-options-box"></div>
        </div>
    </div>

    <!-- LINK UP FILE 2 EXTERNAL QUESTIONS CODE REPOS -->
    <script src="questions.js"></script>

    <script>
        // Set Default Seed Admin Profile credentials if absent on device
        if(!localStorage.getItem('studentDB')) {
            localStorage.setItem('studentDB', JSON.stringify({
                "admin": { password: "admin", logins: 0, score: 0 }
            }));
        }

        let activeUserKey = "";
        let activeGradeFilter = "k";
        let currentQuizQuestions = [];
        let currentQuestionIndex = 0;
        let currentQuizScore = 0;
        let currentSubjectKey = "";
        let currentLevelIndex = 0;

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const db = JSON.parse(localStorage.getItem('studentDB'));

            if(db[user] && db[user].password === pass) {
               // This tells the browser to save their login session even if they change pages!
sessionStorage.setItem('activeUser', user);
activeUserKey = user;

                db[user].logins += 1; // Increment user log track metrics
                localStorage.setItem('studentDB', JSON.stringify(db));

                document.getElementById('panel-login').classList.remove('active');
                if(user === 'admin') {
                    document.getElementById('panel-admin').classList.add('active');
                    renderAdminTable();
                } else {
                    document.getElementById('panel-student').classList.add('active');
                    renderStudentDashboard();
                }
            } else {
                alert("Incorrect username or password! Please try again.");
            }
        }

        function renderStudentDashboard() {
            const db = JSON.parse(localStorage.getItem('studentDB'));
            document.getElementById('student-welcome').textContent = `Assalamu Alaikum, ${activeUserKey}! 👋`;
            document.getElementById('stat-logins').textContent = db[activeUserKey].logins;
            document.getElementById('stat-score').textContent = `${db[activeUserKey].score || 0} XP`;

            const subjects = ['math', 'iq', 'english', 'arabic'];
            subjects.forEach(sub => {
                const track = document.getElementById(`track-${sub}`);
                track.innerHTML = "";
               // FIXED: If there is no data in datasetBank for this stage yet, it defaults to a clean, open array layout
                const levelData = (datasetBank[activeGradeFilter] && datasetBank[activeGradeFilter][sub]) ? datasetBank[activeGradeFilter][sub] : [true, true, true, true, true];


for(let l = 1; l <= 5; l++) {
    // If the folder path exists on your computer, the levels stay fully unlocked and clickable!
    const isLocked = l > levelData.length;





                    const row = document.createElement('div');
                    row.className = `level-row ${isLocked ? 'locked' : ''}`;
                    row.innerHTML = `<span>Level ${l}</span> <i class="fa-solid ${isLocked ? 'fa-lock' : 'fa-play'}"></i>`;
                    if(!isLocked) {
                        row.onclick = () => launchQuizEngine(sub, l - 1);
                    }
                    track.appendChild(row);
                }
            });
        }
function launchQuizEngine(sub, lvlIdx) {
    // This looks at what folder stage is selected (e.g., stage-A-kindergarten/math/level-1.html)
    const folderDestinationUrl = `${activeGradeFilter}/${sub}/level-${lvlIdx + 1}.html`;
    
    // Jump cleanly directly over to the subfolder quiz file!
    window.location.href = folderDestinationUrl;
}


        function displayQuestionNode() {
            const qData = currentQuizQuestions[currentQuestionIndex];
            document.getElementById('quiz-title-tag').textContent = `${currentSubjectKey.toUpperCase()} - LEVEL ${currentLevelIndex + 1}`;
            document.getElementById('quiz-progress-tag').textContent = `Q: ${currentQuestionIndex + 1}/${currentQuizQuestions.length}`;
            document.getElementById('quiz-question-text').textContent = qData.q;

            const optBox = document.getElementById('quiz-options-box');
            optBox.innerHTML = "";

            qData.a.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerHTML = `<i class="fa-regular fa-circle"></i> ${choice}`;
                btn.onclick = () => evaluateChoice(btn, choice, qData.c);
                optBox.appendChild(btn);
            });
        }

        function evaluateChoice(btn, chosen, correct) {
            document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = "none");
            if(chosen === correct) {
                btn.style.borderColor = "var(--success-green)";
                btn.style.background = "rgba(0, 230, 118, 0.1)";
                currentQuizScore += 10; // Earn 10 XP per matching solution
            } else {
                btn.style.borderColor = "var(--accent-pink)";
                btn.style.background = "rgba(255, 51, 102, 0.1)";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if(currentQuestionIndex < currentQuizQuestions.length) {
                    displayQuestionNode();
                } else {
                    completeQuizSession();
                }
            }, 1000);
        }

        function completeQuizSession() {
            document.getElementById('quiz-frame').classList.remove('active');
            alert(`🎉 Quiz Completed!\nYou earned: +${currentQuizScore} XP!`);
            
            const db = JSON.parse(localStorage.getItem('studentDB'));
            db[activeUserKey].score = (db[activeUserKey].score || 0) + currentQuizScore;
            localStorage.setItem('studentDB', JSON.stringify(db));
            renderStudentDashboard();
        }

        function addNewStudent() {
            const name = document.getElementById('new-student-name').value.trim();
            const pass = document.getElementById('new-student-pass').value.trim();
            if(!name || !pass) return alert("Fill in both tracking fields first!");

            const db = JSON.parse(localStorage.getItem('studentDB'));
            if(db[name]) return alert("Student username already exists!");

            db[name] = { password: pass, logins: 0, score: 0 };
            localStorage.setItem('studentDB', JSON.stringify(db));
            
            document.getElementById('new-student-name').value = "";
            document.getElementById('new-student-pass').value = "";
            renderAdminTable();
        }

        function renderAdminTable() {
            const db = JSON.parse(localStorage.getItem('studentDB'));
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";

            Object.keys(db).forEach(user => {
                if(user === 'admin') return;
                const row = document.createElement('tr');
                row.innerHTML = `<td><b>${user}</b></td><td><code>${db[user].password}</code></td><td>${db[user].logins} times</td><td>${db[user].score || 0} XP</td>`;
                tbody.appendChild(row);
            });
        }

        function toggleGrade(btn, gradeKey) {
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeGradeFilter = gradeKey;
            renderStudentDashboard();
        }

        function triggerLogout() {
            activeUserKey = "";
            document.getElementById('panel-student').classList.remove('active');
            document.getElementById('panel-admin').classList.remove('active');
            document.getElementById('panel-login').classList.add('active');
            document.getElementById('login-user').value = "";
            document.getElementById('login-pass').value = "";
        }


        // Auto-login check when returning from separate quiz web pages
window.addEventListener('DOMContentLoaded', () => {
    const savedUser = sessionStorage.getItem('activeUser');
    if (savedUser) {
        activeUserKey = savedUser;
        document.getElementById('panel-login').classList.remove('active');
        
        if (savedUser === 'admin') {
            document.getElementById('panel-admin').classList.add('active');
            renderAdminTable();
        } else {
            document.getElementById('panel-student').classList.add('active');
            renderStudentDashboard();
        }
    }
});

// Update your logout function to clear the session memory too
const originalLogout = triggerLogout;
triggerLogout = function() {
    sessionStorage.removeItem('activeUser');
    originalLogout();
};
 


    </script>
</body>
</html>
