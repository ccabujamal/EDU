<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz Challenge — Level 1</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
       /* ✅ NEW GLOWING CYAN LOOK: */
:root {
    --bg-space: #2D1B60;
    --surface-card: #4E31AA;
    --accent-yellow: #FFD23F;; /* Changed to #9C27B0;! */
    --accent-pink: #FF3366;
    --accent-cyan: #00F5D4;
    --success-green: #00E676;
    --text-white: #FFFFFF;
}


        body { background-color: var(--bg-space); color: var(--text-white); font-family: 'Fredoka', sans-serif; padding: 20px; text-align: center; }
        
        .quiz-box { 
            background-color: var(--surface-card); border: 3px solid var(--accent-yellow); 
            border-radius: 20px; max-width: 440px; margin: 30px auto; padding: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative;
        }
        
        .progress-track { display: flex; justify-content: center; gap: 6px; margin: 14px 0; }
        .progress-dot { width: 12px; height: 12px; background: rgba(0,0,0,0.3); border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .progress-dot.active { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); }
        .progress-dot.correct { background: var(--success-green); }
        .progress-dot.wrong { background: var(--accent-pink); }

        .quiz-q { font-size: 1.35rem; margin: 20px 0; line-height: 1.4; min-height: 70px; display: flex; align-items: center; justify-content: center; }
        .options-stack { display: flex; flex-direction: column; gap: 10px; }
        
        .opt-btn { 
            background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); 
            color: #fff; padding: 14px; border-radius: 12px; font-size: 1.05rem; 
            text-align: left; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 10px;
        }
        .header-tag { color: var(--accent-cyan); font-size: 0.85rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="quiz-box">
        <div class="header-tag">Math3 Level 1 — Question <span id="q-current-number">1</span>/10</div>
        
        <!-- 10 Dots Progress Bar Track -->
        <div class="progress-track" id="dots-container"></div>
        
        <div class="quiz-q" id="question-display-box">Loading Question...</div>
        <div class="options-stack" id="options-display-box"></div>
    </div>

    <script>
        // 📥 The Complete Level 1 Dataset Array Block
    const localQuestionsList = [
    { q: "If a line passes through points (0,0) and (2,4), what is its slope?", a: ["0.5", "1", "2", "4"], c: "2" },
    { q: "In which quadrant is the coordinate point (-3, -5) located?", a: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], c: "Quadrant III" },
    { q: "What is the slope of a horizontal line?", a: ["0", "1", "-1", "Undefined"], c: "0" },
    { q: "If a line passes through (1,3) and (3,7), what is its slope?", a: ["1", "2", "3", "4"], c: "2" },
    { q: "What is the y-intercept of the line equation y = 3x - 5?", a: ["3", "-3", "5", "-5"], c: "-5" },
    { q: "In which quadrant is the coordinate point (4, -2) located?", a: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], c: "Quadrant IV" },
    { q: "What is the slope of a vertical line?", a: ["0", "1", "Infinity", "Undefined"], c: "Undefined" },
    { q: "What is the x-intercept of the line equation y = 2x - 6?", a: ["2", "3", "-3", "6"], c: "3" },
    { q: "In which quadrant is the coordinate point (-1, 5) located?", a: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], c: "Quadrant II" },
    { q: "What is the slope of the line equation y = -4x + 8?", a: ["-4", "4", "8", "-8"], c: "-4" }
];









        let currentIndex = 0;
        let earnedXpBonus = 0;

        function buildDotsTrack() {
            const container = document.getElementById('dots-container');
            container.innerHTML = "";
            for (let i = 0; i < localQuestionsList.length; i++) {
                const dot = document.createElement('div');
                dot.className = `progress-dot ${i === 0 ? 'active' : ''}`;
                container.appendChild(dot);
            }
        }

        function displayQuestion() {
            const currentData = localQuestionsList[currentIndex];
            document.getElementById('q-current-number').textContent = currentIndex + 1;
            document.getElementById('question-display-box').textContent = currentData.q;
            
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((d, idx) => {
                if(idx === currentIndex) d.classList.add('active');
                else d.classList.remove('active');
            });

            const optBox = document.getElementById('options-display-box');
            optBox.innerHTML = "";

            currentData.a.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerHTML = `<i class="fa-regular fa-circle"></i> ${choice}`;
                btn.onclick = () => processAnswer(btn, choice, currentData.c);
                optBox.appendChild(btn);
            });
        }

        function processAnswer(selectedBtn, selectedValue, finalCorrectValue) {
            document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = "none");
            const dots = document.querySelectorAll('.progress-dot');

            if (selectedValue === finalCorrectValue) {
                selectedBtn.style.borderColor = "var(--success-green)";
                selectedBtn.style.background = "rgba(0, 230, 118, 0.1)";
                dots[currentIndex].classList.add('correct');
                earnedXpBonus += 10;
            } else {
                selectedBtn.style.borderColor = "var(--accent-pink)";
                selectedBtn.style.background = "rgba(255, 51, 102, 0.1)";
                dots[currentIndex].classList.add('wrong');
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < localQuestionsList.length) {
                    displayQuestion();
                } else {
                    finishQuizChallenge();
                }
            }, 1000);
        }

        function finishQuizChallenge() {
            const db = JSON.parse(localStorage.getItem('studentDB'));
            const activeUser = sessionStorage.getItem('activeUser');

            if (activeUser && db[activeUser]) {
                db[activeUser].score = (db[activeUser].score || 0) + earnedXpBonus;
                localStorage.setItem('studentDB', JSON.stringify(db));
            }

            alert(`🏆 Game Finished!\nYou answered all 10 puzzles and scored: +${earnedXpBonus} XP!`);
            // Steps backward 2 levels out of stage-A-kindergarten/iq/ back to main screen
            window.location.href = "../../index.html";
        }

        window.onload = function() {
            buildDotsTrack();
            displayQuestion();
        };
    </script>
</body>
</html>
